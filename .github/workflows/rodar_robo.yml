name: Execucao Automatica do HunterBot

on:
  schedule:
    # Agenda a máquina virtual para rodar sozinha de forma independente todos os dias à meia-noite (Horário UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Adiciona um botão para você poder testar e rodar manualmente quando quiser

jobs:
  auditoria:
    runs-on: ubuntu-latest

    steps:
    - name: Baixando o Codigo do Repositorio
      uses: actions/checkout@v4

    - name: Configurando o Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalando Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executando o HunterBot Pro
      env:
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python teste_ia.py
