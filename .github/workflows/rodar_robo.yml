name: Executar Robo Quantitativo Preditivo

on:
  workflow_dispatch: # Permite que você clique e execute manualmente na aba Actions

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar o Ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências Necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar o Bot Financeiro com Variáveis de Ambiente
        env:
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
